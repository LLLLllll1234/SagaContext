[project]
name = "sagacontext"
version = "0.1.0"
description = "Personalized memory layer for coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "pydantic>=2.0", "tomli-w>=1.0", "typer>=0.12", "uvicorn>=0.29"]

[project.scripts]
sagactl = "sagacontext.cli:app"
sagacontext-daemon = "sagacontext.daemon:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
