[project]
name = "sagacontext"
version = "1.0.0"
description = "Personalized memory layer for coding agents"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "pydantic>=2.0", "pyyaml>=6.0", "tomli-w>=1.0", "typer>=0.12", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sagacontext.console" = ["_static/index.html", "_static/assets/*"]

[project.scripts]
sagactl = "sagacontext.cli:app"
sagacontext-daemon = "sagacontext.daemon:main"

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[dependency-groups]
dev = ["pytest>=8"]
